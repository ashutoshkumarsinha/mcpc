# MCPC — generic macOS MCP client configuration

[app]
name = "mcpc"
version = "1.0.0"

[client]
# Server used when --server is omitted (must match a [[servers]].name)
default_server = "test-server"
protocol_version = "2024-11-05"
request_timeout_seconds = 120
log_server_stderr = false
# Sync servers from Cursor mcp.json into config.toml when the file changes (GUI).
mcp_json_hot_reload = true
# Optional override; defaults to ~/.cursor/mcp.json and .cursor/mcp.json
# mcp_json_watch_paths = ["~/.cursor/mcp.json", ".cursor/mcp.json"]

[logging]
# Global log level: trace | debug | info | notice | warning | error | critical | none
level = "info"
# Where MCPC writes its own logs: stderr | stdout | none
destination = "stderr"

[logging.components]
# Per-label overrides (exact match or prefix). Useful for noisy dependencies.
mcpc = "info"
MCPClient = "warning"

# --- MCP servers -----------------------------------------------------------
# transport: "stdio" | "sse" | "streamable_http" | "websocket"

# Bundled integration-test server (Python — see test-server/). Requires uv for `make test`.
[[servers]]
name = "test-server"
transport = "stdio"
command = "uv"
args = ["run", "--directory", "test-server", "python", "server.py"]
env = { PYTHONUNBUFFERED = "1" }

# Example SSE server (MCP 2024-11-05 — GET /sse stream + POST message endpoint):
